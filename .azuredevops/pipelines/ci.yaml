trigger:
  tags:
    include:
      - "*"
  branches:
    include:
      - develop
      - feature/*
      - release/*
      - renovate/*
      - hotfix/*

resources:
  repositories:
    - repository: templates
      type: git
      name: pipeline-templates/pipeline-templates
      ref: refs/heads/support/v1.x

extends:
  template: k8s-dockerfile.yaml@templates
  parameters:
    containerImageRepository: "ciz01app"
    serviceName: "ciz01app"
    sonarDisabled: true