trigger: none

pool:
  name: Web20

resources:
  pipelines:
    - pipeline:   ci                                          # Name of the pipeline resource.
      source:     ciz01app-ci                      # The name of the pipeline referenced by this pipeline resource.
      trigger:    true                                        # Run app-cd pipeline when any run of packing-station-app-ci completes
  repositories:
    - repository: templates
      type:       git
      name:       pipeline-templates\pipeline-templates
      ref:        refs/heads/support/v1.x
    - repository: iacRepo
      type:       git
      name:       platform-gencode\ciz01                          # AzdoPojectName\iacRepositoryName

extends:
  template: gcp-promotion.yaml@templates
  parameters:
    #serviceName: "ciz01app"                                     # RepositoryName (lowercase)
    deploymentType: "run"                                      # Deployment type - cloud run job
    iacRepositoryName: "ciz01"                                     # iac repository name
    serviceName: "ciz01app"
    stages:
      - environment: lab                                           # Azure DevOps environment
        target:       "prj-gcp-l-plat-gencode-ciz01"                      # GCP-project name
        gcpProjectId: "l-plat-gencode-ciz01"                              # GCP-project id
        gcpRegion:    "europe-west4"                               # GCP region